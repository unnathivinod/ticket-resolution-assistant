# Starts the databases the project needs, plus a toolbox container for one-off jobs.
# Run:  docker compose up -d      Stop:  docker compose down
# Our own services (embedding, retrieval, triage, ...) get added here step by step.

name: ticket-assistant

services:
  # PostgreSQL: the source of truth (tickets, KB articles, taxonomy, feedback, audit log)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, the first time the database is created, to build the tables
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/migrations/002_evolving_data.sql:/docker-entrypoint-initdb.d/02_evolving_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Qdrant: the vector database (stores embeddings, does semantic + keyword search)
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl, so we just check that the port answers
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis: cache, rate-limit counters, and the ingestion queue (Redis Streams)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Embedding service: turns text into vectors (dense + BM25) and reranks search results
  embedding:
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
      args:
        EMBEDDING_DENSE_MODEL: ${EMBEDDING_DENSE_MODEL:-BAAI/bge-small-en-v1.5}
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8004}:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8004/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Retrieval service: hybrid search over Qdrant plus reranking
  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      RETRIEVAL_QDRANT_URL: http://qdrant:6333
      RETRIEVAL_EMBEDDING_URL: http://embedding:8004
    ports:
      - "127.0.0.1:${RETRIEVAL_PORT:-8002}:8002"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Triage service: labels a complaint (category, product, severity, sentiment)
  triage:
    build:
      context: .
      dockerfile: services/triage/Dockerfile
    environment:
      TRIAGE_RETRIEVAL_URL: http://retrieval:8002
      TRIAGE_EMBEDDING_URL: http://embedding:8004
    ports:
      - "127.0.0.1:${TRIAGE_PORT:-8001}:8001"
    depends_on:
      retrieval:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Generation service: drafts the cited resolution with a language model (Ollama on the host by default)
  generation:
    build:
      context: .
      dockerfile: services/generation/Dockerfile
    environment:
      GENERATION_EMBEDDING_URL: http://embedding:8004
      GENERATION_LLM_ENABLED: ${LLM_ENABLED:-true}
      GENERATION_LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GENERATION_LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      GENERATION_LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      GENERATION_LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      GENERATION_LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      GENERATION_LLM_EXTRA_TOKENS: ${LLM_EXTRA_TOKENS:-0}
      # Optional backup model, asked only when the first one fails. Empty = no backup.
      GENERATION_FALLBACK_LLM_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      GENERATION_FALLBACK_LLM_MODEL: ${LLM_FALLBACK_MODEL:-}
      GENERATION_FALLBACK_LLM_API_KEY: ${LLM_FALLBACK_API_KEY:-not-needed}
      GENERATION_MATCH_CHECK: ${LLM_MATCH_CHECK:-false}
    extra_hosts:
      # Lets the container reach Ollama running on the host machine (needed on Linux).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GENERATION_PORT:-8003}:8003"
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # API gateway: the single front door. Auth, rate limit, cache, orchestration, audit log, feedback.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_TRIAGE_URL: http://triage:8001
      GATEWAY_RETRIEVAL_URL: http://retrieval:8002
      GATEWAY_GENERATION_URL: http://generation:8003
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_API_KEYS: ${API_KEYS:-dev-local-key}
      GATEWAY_ADMIN_API_KEYS: ${ADMIN_API_KEYS:-dev-admin-key}
      GATEWAY_MIN_RELEVANCE: ${MIN_RELEVANCE:-0}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      triage:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      generation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Ingestion worker: keeps the search index in step with PostgreSQL when tickets,
  # articles or classes change. It has no API; the gateway hands it work through a Redis queue.
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      INGESTION_REDIS_URL: redis://redis:6379/0
      INGESTION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INGESTION_QDRANT_URL: http://qdrant:6333
      INGESTION_EMBEDDING_URL: http://embedding:8004
    ports:
      - "127.0.0.1:${INGESTION_METRICS_PORT:-8005}:8005"   # metrics only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8005/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Agent UI: a simple web page for support agents
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8000
      GATEWAY_API_KEY: ${UI_API_KEY:-dev-local-key}
      # Lets the page show the "record the real fix" form. Leave empty to hide the form.
      GATEWAY_ADMIN_API_KEY: ${UI_ADMIN_API_KEY-dev-admin-key}
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus: collects the numbers every service publishes on /metrics and checks the alert rules
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Grafana: the dashboard. It is set up from files, so it looks the same on every machine.
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Anyone on this machine can look (read-only) without logging in. Turn off for real use.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/support_assistant.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Toolbox: one-off jobs (generate data, load data, run tests and evals).
  # Not started by "docker compose up". Use:  docker compose run --rm tools <command>
  tools:
    build:
      context: .
      dockerfile: tools/Dockerfile
    profiles: ["tools"]
    environment:
      # Lets scripts import the project's own code (libs/, services/) from any folder.
      PYTHONPATH: /app
      # Inside Docker, services reach each other by name (postgres, qdrant, ...), not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8004
      RETRIEVAL_URL: http://retrieval:8002
      TRIAGE_URL: http://triage:8001
      GENERATION_URL: http://generation:8003
      GATEWAY_URL: http://gateway:8000
      GATEWAY_API_KEY: ${UI_API_KEY:-dev-local-key}
      GATEWAY_ADMIN_API_KEY: ${TOOLS_ADMIN_API_KEY:-dev-admin-key}
      INGESTION_URL: http://ingestion:8005
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - .:/app
    working_dir: /app

# Named volumes keep the data when containers are restarted
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
