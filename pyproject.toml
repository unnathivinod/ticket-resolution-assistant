[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not integration'"
markers = ["integration: needs the real services running (docker compose up -d)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads these from a function's default values. That is how the framework is meant to be used.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
