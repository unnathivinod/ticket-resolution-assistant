# Questions that have nothing to do with telecom support.
# Used by the evals to check that the system refuses instead of inventing an answer.

- What is the weather going to be like tomorrow?
- Can you recommend a good pizza place near me?
- How do I reset my Netflix password?
- My fridge is making a loud humming noise.
- Write me a poem about the ocean.
- I want a refund for my cancelled flight.
- My laptop will not turn on after a Windows update.
- What is the capital of Australia?
- How do I file my income tax return?
- My car insurance renewal price has gone up.
- Can you help me book a doctor's appointment?
- The washing machine is leaking water on the floor.
- What is the best way to learn Python?
- My parcel from the online shop has not arrived.
- How many calories are in a banana?
- I need help writing a cover letter for a job.
- My electricity meter is showing an error.
- Which football team won the league last year?
- How do I change a flat tyre?
- My bank card was swallowed by the cash machine.
- Translate good morning into French.
- My gas boiler has lost pressure.
- How do I get a stain out of a carpet?
- I forgot the password to my email account with another company.
- What time does the supermarket close today?
- The printer in my office says paper jam.
- Can you explain how photosynthesis works?
- My gym membership was renewed without my consent.
- How long should I boil an egg?
- I want to complain about noisy neighbours.
